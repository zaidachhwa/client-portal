# Production on a VPS: the app is exposed on loopback behind the host Nginx reverse proxy.
#   docker compose -f docker-compose.prod.yml up -d --build
# The database is MongoDB Atlas (MONGODB_URI in .env.production); uploads go to Cloudinary when configured,
# otherwise to the "uploads" volume.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    ports: ["127.0.0.1:14002:3000"]

volumes:
  uploads:
